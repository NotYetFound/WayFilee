name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Filee.slnx
      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1
      - name: Build
        run: dotnet build Filee.slnx --no-restore -c Release
      - name: Test
        run: dotnet test Filee.slnx --no-build -c Release --logger trx --results-directory TestResults
      - name: Shell syntax
        run: bash -n build/build-wayland.sh && sh -n installer/linux/install.sh installer/linux/uninstall.sh
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-results
          path: TestResults/
          if-no-files-found: ignore
