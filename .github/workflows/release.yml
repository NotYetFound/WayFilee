name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  packages:
    uses: ./.github/workflows/portable.yml
    with:
      version: ${{ github.ref_name }}

  draft:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wayland-*
          merge-multiple: true
          path: Releases
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" Releases/* --draft --verify-tag --repo "${{ github.repository }}"
