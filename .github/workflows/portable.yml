name: Wayland packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Package version (empty uses Directory.Build.props)
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install package build tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd
      - name: Build package
        env:
          WAYFILEE_RID: ${{ matrix.rid }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          bash build/build-wayland.sh "${PACKAGE_VERSION}"
          bash build/build-linux-packages.sh "${PACKAGE_VERSION}"
      - name: Check release assets
        run: |
          cd Releases
          tar -tzf *-${{ matrix.rid }}.tar.gz | grep -E '/(Filee|filee-cli|install.sh|kwin/wayfilee-donut/metadata.json)$'
          rpm -qpl *-${{ matrix.rid }}.rpm | grep '/opt/wayfilee/Filee$'
          dpkg-deb -c *-${{ matrix.rid }}.deb | grep '/opt/wayfilee/Filee$'
          tar -tf *-${{ matrix.rid }}.pkg.tar.zst | grep './opt/wayfilee/Filee$'
      - uses: actions/upload-artifact@v7
        with:
          name: wayland-${{ matrix.rid }}
          path: Releases/*-${{ matrix.rid }}*
          if-no-files-found: error
